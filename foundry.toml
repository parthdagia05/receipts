[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# via_ir resolves "stack too deep" for the ERC-8004 feedback path (many dynamic
# args: an attestation with a bytes signature plus feedback strings).
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
